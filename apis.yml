aid: relay-payments
name: Relay Payments
description: 'Relay Payments operates a secure digital payment network purpose-built
  for the freight and trucking industry. Its mobile app and platform let carriers,
  owner-operators, brokers, and merchants transact contactlessly for diesel fuel,
  lumper (dock unloading) fees, scales, parking, truck repairs, and freight payments
  between brokers and carriers, replacing cash, fleet checks, and legacy fuel cards
  while reducing fraud and streamlining back-office reconciliation. Relay is backed
  by Ribbit Capital. Partner/system integration is offered under a Relay System Integration
  Agreement, with developer documentation gated behind partner authentication at docs.relaypayments.com;
  no public API specification is currently published.'
